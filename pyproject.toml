[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "patholens"
version = "0.1.0"
description = "A Traceable Retrieval-Based Clinical Decision Support System for Breast Cancer Histopathology"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Emir Arda Eker"},
    {name = "Faruk Rıza Öz"},
]

dependencies = [
    # Core ML
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.0",
    "transformers>=4.40.0",
    "safetensors",

    # WSI Processing
    "openslide-python>=1.3.1",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",

    # Data & Scientific
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "h5py>=3.10.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",

    # Retrieval (CPU-safe default; install [gpu] extra for GPU-accelerated FAISS)
    "faiss-cpu>=1.7.4",

    # NLP / LLM
    "huggingface-hub>=0.23.0",

    # FHIR
    "fhir.resources>=7.1.0",

    # Web / API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Config & Logging
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
# GPU extras: required for Mamba SSM (sequence encoding) and GPU-accelerated FAISS
# Install with: pip install -e ".[gpu]"
gpu = [
    "mamba-ssm>=2.0.0",
    "causal-conv1d>=1.2.0",
    "faiss-gpu>=1.7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
